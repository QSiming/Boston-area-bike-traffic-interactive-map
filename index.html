<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bikewatching</title>
    <link rel="stylesheet" href="global.css" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

    <!-- Mapbox GL JS CSS -->
    <link
    href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
    rel="stylesheet"
    />
    <!-- link map.js in index.html -->
    <script src="map.js" type="module"></script>
    <!-- link map.css in index.html -->
    <link rel="stylesheet" href="map.css" />
</head>

<body>

    <header>
        <h1>🚴🏼‍♀️ Bikewatching</h1>

        <label>
            Filter by time:
            <input
                id="time-slider"
                type="range"
                min="-1"
                max="1440"
                value="-1"
            >
            <time id="selected-time"></time>
            <em id="any-time">(any time)</em>
        </label>
    </header>

     <p>An interactive map of bike traffic in the Boston area.</p>

    <!-- Add a div for the map -->
    <div id="map">
        <svg></svg>
    </div>

</body>
</html>
